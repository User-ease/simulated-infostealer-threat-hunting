name: Week 9 Windows Security audit
on:
  workflow_dispatch:
  push:
    branches: [week9-windows-audit]
    paths: [scripts/collect_week9_windows.ps1, .github/workflows/week9-windows.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect native Security events
        shell: pwsh
        run: ./scripts/collect_week9_windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/week9-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: week9-windows-security
          path: ${{ runner.temp }}/week9-evidence
          if-no-files-found: error
