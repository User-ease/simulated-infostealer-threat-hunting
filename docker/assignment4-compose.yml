name: threat-hunting-assignment4
services:
  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      cluster.name: threat-hunting-assignment4
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - assignment4-data:/usr/share/elasticsearch/data
    mem_limit: 1280m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: kibana:9.5.5
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_HOST: 0.0.0.0
      SERVER_NAME: threat-hunting-assignment4
      TELEMETRY_ENABLED: "false"
      NEWSFEED_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:15601:5601"
    mem_limit: 1280m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
volumes:
  assignment4-data:
